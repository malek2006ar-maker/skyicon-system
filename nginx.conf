# إعدادات Nginx - نظام سكاي آيكون
# Sky Icon Accounting System - Nginx Configuration
# v5.3.5 - Production Ready

# ==========================================
# HTTP Server Block (التوجيه إلى HTTPS)
# ==========================================

server {
    listen 80;
    listen [::]:80;
    
    server_name yourdomain.com www.yourdomain.com;
    
    # إعادة توجيه جميع طلبات HTTP إلى HTTPS
    return 301 https://$server_name$request_uri;
}

# ==========================================
# HTTPS Server Block
# ==========================================

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    
    server_name yourdomain.com www.yourdomain.com;
    root /var/www/html/sky-icon;
    index index.html;
    
    # ==========================================
    # SSL Configuration
    # ==========================================
    
    ssl_certificate /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;
    
    # SSL Protocols & Ciphers
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;
    
    # SSL Session
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;
    
    # OCSP Stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    ssl_trusted_certificate /etc/letsencrypt/live/yourdomain.com/chain.pem;
    
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;
    
    # ==========================================
    # Security Headers
    # ==========================================
    
    # HSTS (HTTP Strict Transport Security)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    
    # منع التضمين في iframe
    add_header X-Frame-Options "SAMEORIGIN" always;
    
    # منع MIME type sniffing
    add_header X-Content-Type-Options "nosniff" always;
    
    # XSS Protection
    add_header X-XSS-Protection "1; mode=block" always;
    
    # Referrer Policy
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    
    # Content Security Policy
    add_header Content-Security-Policy "default-src 'self' https:; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://fonts.googleapis.com; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com https://cdn.jsdelivr.net https://cdnjs.cloudflare.com data:; img-src 'self' data: https:; connect-src 'self'; frame-ancestors 'self';" always;
    
    # Permissions Policy
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    
    # ==========================================
    # Logging
    # ==========================================
    
    access_log /var/log/nginx/sky-icon-access.log;
    error_log /var/log/nginx/sky-icon-error.log;
    
    # ==========================================
    # GZIP Compression
    # ==========================================
    
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/rss+xml font/truetype font/opentype application/vnd.ms-fontobject image/svg+xml;
    gzip_disable "msie6";
    
    # ==========================================
    # Browser Caching
    # ==========================================
    
    # HTML - بدون تخزين مؤقت
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }
    
    # CSS و JavaScript - شهر واحد
    location ~* \.(css|js)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    
    # الصور - سنة واحدة
    location ~* \.(jpg|jpeg|png|gif|ico|svg|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    
    # الخطوط - سنة واحدة
    location ~* \.(ttf|ttc|otf|eot|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    
    # JSON و XML - أسبوع
    location ~* \.(json|xml)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
    
    # ==========================================
    # حماية الملفات الحساسة
    # ==========================================
    
    # منع الوصول إلى ملفات التوثيق
    location ~* \.(md|log|bak|config|env)$ {
        deny all;
        return 404;
    }
    
    # منع الوصول إلى ملفات Git
    location ~ /\.git {
        deny all;
        return 404;
    }
    
    # منع الوصول إلى الملفات المخفية
    location ~ /\. {
        deny all;
        return 404;
    }
    
    # ==========================================
    # Single Page Application (SPA)
    # ==========================================
    
    location / {
        try_files $uri $uri/ /index.html;
    }
    
    # ==========================================
    # صفحات الأخطاء المخصصة
    # ==========================================
    
    error_page 404 /index.html;
    error_page 403 /index.html;
    error_page 500 502 503 504 /index.html;
    
    # ==========================================
    # تحسينات إضافية
    # ==========================================
    
    # إخفاء نسخة Nginx
    server_tokens off;
    
    # حد أقصى لحجم الملفات المرفوعة
    client_max_body_size 10M;
    
    # Buffers
    client_body_buffer_size 10K;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 16k;
    
    # Timeouts
    client_body_timeout 12;
    client_header_timeout 12;
    keepalive_timeout 15;
    send_timeout 10;
}

# ==========================================
# إعادة التوجيه من www إلى non-www (اختياري)
# ==========================================

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    
    server_name www.yourdomain.com;
    
    ssl_certificate /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;
    
    return 301 https://yourdomain.com$request_uri;
}
